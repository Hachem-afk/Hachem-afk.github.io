<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raytracing Games - Portfolio Hachem Lamrini</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .play-button {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 50px;
            height: 50px;
            background: rgba(0, 150, 255, 0.9);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 150, 255, 0.3);
            z-index: 10;
        }
        
        .play-button:hover {
            transform: scale(1.1);
            background: rgba(0, 150, 255, 1);
            box-shadow: 0 6px 30px rgba(0, 150, 255, 0.5);
        }
        
        .play-button.playing {
            background: rgba(255, 100, 100, 0.9);
        }
        
        .play-button.playing:hover {
            background: rgba(255, 100, 100, 1);
            box-shadow: 0 6px 30px rgba(255, 100, 100, 0.5);
        }
        
        .game-card {
            position: relative;
        }
        
        #pageLoader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a1a;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        #pageLoader.active {
            opacity: 1;
            pointer-events: all;
        }
        
        .mini-loader {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(138, 107, 255, 0.2);
            border-top: 5px solid #8a6bff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="pageLoader">
        <div class="mini-loader"></div>
    </div>

    <div class="interactive-bg"></div>
    <canvas class="bg-canvas" id="bgCanvas"></canvas>
    
    <div class="custom-cursor" id="cursor"></div>
    <div class="ambient-light" id="ambientLight"></div>
    
    <a href="index.html" class="back-button" id="backButton">
        <i class="fas fa-arrow-left"></i> Retour au portfolio
    </a>

    <div class="container">
        <div class="header">
            <h1 class="title">Raytracing Engine</h1>
            <p class="subtitle">Simulations physiques ultra-réalistes avec raytracing optimisé</p>
        </div>

        <div class="games-grid" style="justify-content: center;">
            <div class="game-card">
                <div class="loading-overlay" id="oceanLoading">
                    <div class="loading-spinner"></div>
                </div>
                <canvas id="oceanCanvas" class="game-canvas" width="500" height="450"></canvas>
                <button class="play-button" id="oceanPlayButton" onclick="toggleRaytracing('ocean')">
                    <i class="fas fa-play"></i>
                </button>
                <div class="performance-info" id="oceanPerf">FPS: 0 | Rayons: 0</div>
                <div class="game-info">
                    <h3 class="game-title">Ocean Raytracing</h3>
                    <p class="game-desc">Simulation océanique avec raytracing volumétrique et caustiques dynamiques.</p>
                </div>
            </div>
        </div>

        <div id="errorMessage" class="error-message" style="display: none;">
            <i class="fas fa-exclamation-triangle"></i>
            <span id="errorText"></span>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/performance-monitor.js"></script>
    <script src="js/particle-system.js"></script>
    <script src="js/raytracing-engine.js"></script>
    <script src="js/ocean-simulation.js"></script>
    
    <script>
        let activeGame = null;
        let bgAnimationId;
        let mouseX = 0, mouseY = 0;
        let cursorTrails = [];
        let isGameRunning = false;
        let performanceMonitor;
        let particleSystem;
        let oceanEngine;

        function init() {
            try {
                document.getElementById('backButton').addEventListener('click', function(e) {
                    e.preventDefault();
                    document.getElementById('pageLoader').classList.add('active');
                    setTimeout(function() {
                        window.location.href = 'index.html';
                    }, 500);
                });

                if (!Utils.checkWebGLSupport()) {
                    showError("WebGL n'est pas supporté par votre navigateur. Veuillez utiliser un navigateur moderne.");
                    return;
                }

                performanceMonitor = new PerformanceMonitor();
                particleSystem = new ParticleSystem(document.getElementById('bgCanvas'));
                oceanEngine = new OceanSimulation();
                initCursorEffects();
                startBackgroundAnimation();
                
            } catch (error) {
                console.error("Initialization error:", error);
                showError("Erreur d'initialisation: " + error.message);
            }
        }

        function initCursorEffects() {
            const cursor = document.getElementById('cursor');
            const ambientLight = document.getElementById('ambientLight');
            
            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
                cursor.style.left = (mouseX - 10) + 'px';
                cursor.style.top = (mouseY - 10) + 'px';
                ambientLight.style.left = (mouseX - 150) + 'px';
                ambientLight.style.top = (mouseY - 150) + 'px';
                addCursorTrail(mouseX, mouseY);
            });
        }

        function addCursorTrail(x, y) {
            const trail = document.createElement('div');
            trail.className = 'cursor-trail';
            trail.style.left = (x - 3) + 'px';
            trail.style.top = (y - 3) + 'px';
            document.body.appendChild(trail);
            cursorTrails.push(trail);
            
            setTimeout(() => {
                trail.style.opacity = '0';
                trail.style.transform = 'scale(0)';
            }, 50);
            
            setTimeout(() => {
                if (trail.parentNode) {
                    trail.parentNode.removeChild(trail);
                }
                const index = cursorTrails.indexOf(trail);
                if (index > -1) {
                    cursorTrails.splice(index, 1);
                }
            }, 500);
            
            if (cursorTrails.length > 10) {
                const oldTrail = cursorTrails.shift();
                if (oldTrail.parentNode) {
                    oldTrail.parentNode.removeChild(oldTrail);
                }
            }
        }

        function startBackgroundAnimation() {
            function animate() {
                particleSystem.update(mouseX, mouseY);
                particleSystem.render();
                bgAnimationId = requestAnimationFrame(animate);
            }
            animate();
        }

        function toggleRaytracing(type) {
            const playButton = document.getElementById(type + 'PlayButton');
            const icon = playButton.querySelector('i');
            
            if (isGameRunning && activeGame === type) {
                stopRaytracing(type);
                icon.className = 'fas fa-play';
                playButton.classList.remove('playing');
                isGameRunning = false;
                activeGame = null;
            } else {
                if (activeGame && activeGame !== type) {
                    stopRaytracing(activeGame);
                    document.getElementById(activeGame + 'PlayButton').querySelector('i').className = 'fas fa-play';
                    document.getElementById(activeGame + 'PlayButton').classList.remove('playing');
                }
                
                startRaytracing(type);
                icon.className = 'fas fa-pause';
                playButton.classList.add('playing');
                isGameRunning = true;
                activeGame = type;
            }
        }

        function startRaytracing(type) {
            try {
                const loadingElement = document.getElementById(type + 'Loading');
                loadingElement.style.display = 'flex';
                
                setTimeout(() => {
                    if (type === 'ocean') {
                        oceanEngine.init('oceanCanvas', 'oceanPerf');
                        oceanEngine.start();
                    }
                    loadingElement.style.display = 'none';
                }, 800);
                
            } catch (error) {
                console.error(`Error starting ${type} simulation:`, error);
                showError(`Erreur lors du démarrage de la simulation ${type}: ${error.message}`);
                document.getElementById(type + 'Loading').style.display = 'none';
            }
        }

        function stopRaytracing(type) {
            try {
                if (type === 'ocean' && oceanEngine) {
                    oceanEngine.stop();
                }
            } catch (error) {
                console.error(`Error stopping ${type} simulation:`, error);
            }
        }

        function showError(message) {
            const errorElement = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            errorText.textContent = message;
            errorElement.style.display = 'block';
            setTimeout(() => {
                errorElement.style.display = 'none';
            }, 5000);
        }

        window.addEventListener('resize', () => {
            if (particleSystem) particleSystem.resize();
            if (oceanEngine && activeGame === 'ocean') oceanEngine.resize();
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (bgAnimationId) cancelAnimationFrame(bgAnimationId);
                if (activeGame) stopRaytracing(activeGame);
            } else {
                startBackgroundAnimation();
                if (activeGame && isGameRunning) startRaytracing(activeGame);
            }
        });

        document.addEventListener('DOMContentLoaded', init);
        
        window.addEventListener('beforeunload', () => {
            if (bgAnimationId) cancelAnimationFrame(bgAnimationId);
            if (activeGame) stopRaytracing(activeGame);
        });
    </script>
</body>
</html>
